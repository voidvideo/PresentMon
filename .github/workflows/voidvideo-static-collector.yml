name: VoidVideo static collector

on:
  workflow_dispatch:
  push:
    branches: [voidvideo-static-collector]
  pull_request:
    branches: [voidvideo-static-collector]

permissions:
  contents: read

jobs:
  build:
    name: Build x64 LLVM-mingw static library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/src" -w /src docker.io/mstorsjo/llvm-mingw:latest \
            bash VoidVideoPresentMon/build-mingw.sh

      - uses: actions/upload-artifact@v4
        with:
          name: voidvideo-presentmon-x64
          path: VoidVideoPresentMon/out/stage
          if-no-files-found: error
